# Valores padrao de todo parametro que os requisitos descrevem como configurado.
# Segredos nao vivem aqui: eles sao lidos exclusivamente de variaveis de ambiente.

[collection]
# Janela de publicacao do run recorrente e do run imediato, em horas.
janela_incremental_horas = 24
janela_ampla_horas = 720
# Faixa de espera entre dois enriquecimentos consecutivos, em segundos.
intervalo_enriquecimento_min_s = 8
intervalo_enriquecimento_max_s = 20
# Espera imposta a todos os usuarios apos um bloqueio de coleta, em segundos.
intervalo_recuperacao_s = 3600
# Orcamento diario de enriquecimentos, para todo o sistema.
#
# Historico das medicoes, porque este numero so deve mudar contra evidencia:
#
# 1. Dimensionado em 120 quando o desenho supunha uma sessao de conta
#    operacional em risco a cada requisicao.
# 2. A rota publica aceitou 30 requisicoes seguidas a cada 4s, latencia
#    mediana de 0,3s, nenhuma recusa. Media, mas insuficiente para subir: 30
#    nao autoriza afirmar nada sobre 120.
# 3. 2026-08-24, uso real: 120 requisicoes de descricao e 69 buscas de coleta
#    no mesmo dia, espacadas pelos 8 a 20s do governador, com ZERO bloqueios
#    registrados. E a primeira medicao no proprio teto.
#
# 400 fica acima do que foi medido, e isto precisa estar dito. O que sustenta
# a mudanca nao e a medicao ter alcancado 400, e sim a taxa continuar a mesma:
# o intervalo entre requisicoes e o que protege, e ele nao mudou. Subir o teto
# diario estende a duracao da exposicao, nao a intensidade dela.
#
# O risco residual e coberto pelo governador, que grava bloqueio ao terceiro
# fracasso consecutivo e passa a recusar toda chamada por uma hora. Se 400 for
# demais, o sistema para sozinho e o bloqueio fica registrado -- e ai esta
# linha volta para 120 com uma medicao nova a favor.
#
# 400 foi escolhido por cobrir um run inteiro: a coleta real trouxe 403 vagas
# sobreviventes, e um orcamento menor que isso deixa a maior parte do run sem
# descricao, que e o dado do qual o score depende.
orcamento_diario_coleta = 400

# Teto de buscas distintas por run.
#
# O planejador combina eixo por rotulo de nivel, e isso cresce como produto
# cartesiano: um perfil com onze eixos detectados gerou noventa buscas, cada
# uma valendo de uma a tres requisicoes a origem. Perto de duzentas requisicoes
# em rajada -- exatamente o que o governador existe para impedir, e que ele nao
# impedia porque a coleta era o unico caminho que nao passava por ele.
#
# 25 cobre as ancoras do nivel e do nivel acima mais as combinacoes de eixo mais
# proximas, e cabe em cerca de seis minutos no intervalo de 8 a 20s. As buscas
# escritas pelo proprio usuario nunca entram no corte.
#
# Historico deste numero, porque ele governa exposicao e nao deve mudar sem
# motivo escrito:
#
# 1. 25, quando havia uma frente so. O valor cobria as ancoras do nivel e do
#    nivel acima, e substituiu as noventa buscas em rajada que provocaram
#    bloqueio.
# 2. 36, em 12/10/2026, ao passar para quatro frentes (casa, Canada, EUA,
#    Europa). O teto conta requisicao: manter 25 daria seis termos por frente,
#    metade da cobertura que uma frente tinha antes. 36 devolve nove.
# 3. 25 de novo, em 16/10/2026, ao voltar para uma frente so. As tres frentes
#    internacionais nao entregavam o que prometiam -- ver o comentario das
#    frentes abaixo --, e o aumento existia so para elas.
max_buscas_por_run = 25

# Fracao dos sobreviventes que recebe pedido de descricao, pela ORDEM da nota
# provisoria. A descricao e o trecho mais longo do run: uma requisicao a cada 8
# a 20 segundos de governador.
#
# Medido em 14/10/2026, num run de 1 dia com quatro frentes: 380 pedidos de
# descricao enfileirados, cerca de 76 minutos de espera -- o run inteiro levaria
# uma hora e meia, e a coleta, 15 minutos dela.
#
# O corte e pela ordem, e nao por limiar de nota: a nota provisoria e comprimida
# (341 de 448 sobreviventes acima de 60), e um limiar nao separa nada. A ordem
# separa. No historico de 3201 vagas com descricao lida, a fatia do topo da
# ordem provisoria de cada run continha esta parte das que terminaram em
# destaque:
#
#   50% do topo -> 85,6%     60% -> 92,0%     70% -> 95,6%     80% -> 97,2%
#
# 0.7 corta 30% do tempo de descricao e mantem 95,6% dos destaques. O que fica
# de fora nao some: segue no relatorio com a nota provisoria e a marca de
# "avaliada sem leitura da descricao". Vaga cuja descricao ja esta no registro
# entra sempre, porque nao custa requisicao; 1.0 volta a descrever todas.
fracao_enriquecida = 0.7

# Frentes de busca: onde procurar.
#
# Cada termo do planejamento e consultado em TODAS as frentes, entao o numero de
# requisicoes a origem e termos x frentes, e o teto acima vale sobre esse
# produto. Isso e deliberado: o teto existe porque noventa buscas em rajada
# provocaram bloqueio, e frente nova sem divisao multiplicaria a exposicao em
# silencio. Para cobrir mais termos por frente, suba o teto de propósito, com o
# motivo escrito no historico acima.
#
# POR QUE NAO HA FRENTE INTERNACIONAL. De 12 a 16/10/2026 houve tres -- remoto
# no Canada, nos EUA e na Europa, com `remoto = true` --, para achar vaga remota
# paga em moeda forte. Elas nao achavam: a busca sem login do LinkedIn IGNORA o
# filtro de remoto. A propria biblioteca de coleta passou a avisar disso na
# versao 1.3.0 ("the logged-out search ignores both"). Medido no run de 1 dia de
# 14/10/2026, as tres trouxeram 92, 102 e 73 vagas presenciais -- Toronto, New
# York, Madrid -- contra 0, 1 e 0 remotas, e custaram 27 das 36 buscas e a maior
# parte dos 76 minutos de descricao daquele run.
#
# Uma frente de outro pais, aqui, devolve vaga presencial naquele pais. Vaga
# remota internacional pede fonte feita para remoto, que diga quem pode ser
# contratado -- nao um filtro que a origem descarta sem avisar.

[[collection.frentes]]
rotulo = "aqui"
# Vazio = a localizacao do perfil. Nao escreva a cidade aqui: ela e de quem usa.
local = ""
remoto = false

[run]
duracao_maxima_s = 21600
runs_imediatos_por_dia = 3

[session]
duracao_maxima_s = 604800

[retention]
# Tempo sem sessao apos o qual curriculos e extracoes do usuario sao expurgados.
periodo_sem_sessao_dias = 365

[resume]
tamanho_maximo_bytes = 5242880
comprimento_minimo_texto = 400
importacoes_por_dia = 5
formatos_aceitos = ["gdoc", "docx", "pdf"]

[synthesis]
limite_vagas_enviadas = 12
limite_caracteres_texto_externo = 8000
modo_deterministico = false

[report]
limiar_destaque = 70
# Quantas vagas do topo o modelo rele. O topo e onde a decisao acontece, e cada
# vaga a mais custa contexto sem mudar o que o usuario faz: ninguem se candidata
# a quadragesima colocada.
vagas_relidas = 20
# Janela da tabela de empresas contratando, em dias. Trinta e o mesmo alcance da
# janela ampla de coleta -- alem disso o anuncio ja costuma ter saido do ar, e a
# empresa apareceria contratando pelo que fez no mes retrasado.
dias_de_contratacao = 30

# Regiao oferecida como filtro no relatorio, declarada por cidade-ancora e raio.
#
# Nao e lista de municipios: a tabela de cidades e curta de proposito, e manter
# as duas em acordo daria trabalho a cada cidade nova. O raio resolve sozinho --
# cidade entra na regiao assim que ganha coordenada em `cidades.toml`.
#
# 60 km foi medido, e nao estimado. A partir da capital, o municipio mais
# distante da Grande Sao Paulo na tabela e Mogi das Cruzes, a 45 km; os
# seguintes sao Sao Jose dos Campos, Campinas e Sorocaba, todos a 83 km. 60 cai
# no vazio entre os dois grupos, e e tambem o raio de deslocamento que o perfil
# usa -- o mesmo numero com o mesmo significado, visto de outra ancora.
#
# Sem esta secao o filtro nao aparece na tela: uma caixa chamada "Grande Sao
# Paulo" nao serve a quem mora em Recife.
[report.regiao]
rotulo = "Grande São Paulo"
cidade = "sao paulo"
raio_km = 60

[profile]
# Precedencia entre origens: a primeira vence em caso de conflito.
precedencia_origens = ["manual", "resume", "linkedin"]
raio_deslocamento_km = 60

[scoring.pesos]
competencias = 0.40
nivel = 0.20
dominio = 0.15
escopo_gestao = 0.15
geografia = 0.10

[scoring.bonus]
top_applicant = 10
early_applicant = 5
conexoes_na_empresa = 5
actively_reviewing = 5

[scoring.penalidades]
# Vaga presencial fora do raio de deslocamento. O peso do componente geografico
# sozinho nao afunda uma vaga impossivel de aceitar: numa simulacao real, uma
# vaga a 846 km ficou em primeiro lugar porque a descricao dela era curta e o
# candidato cobria tudo que ela citava.
fora_do_raio = 25
muitos_candidatos = 5
repostada_antiga = 10
requisito_eliminatorio = 15

[providers]
# Ordem padrao de tentativa, usada para semear a ordem de cada usuario no
# primeiro cadastro de credencial. O registro em si vive em providers.toml.
ordem_padrao = []
