# Coordenadas das cidades usadas no calculo de distancia do pre-filtro.
#
# A lista e deliberadamente curta e nao pretende cobrir o pais. Ela cobre as
# pracas onde ha volume de vaga em tecnologia, que e onde a distancia decide
# alguma coisa. Cidade fora da lista nao e descartada: ela vira um blocker que
# declara a distancia como desconhecida, e a decisao volta para o candidato.
#
# Acrescentar cidade aqui e mudanca de configuracao, nao de codigo.

[cidades]
# Grande Sao Paulo. A lista era de seis municipios e o filtro metropolitano
# precisa reconhecer a regiao inteira: sem Diadema, Cotia ou Taboao, vaga nessas
# cidades caia como "distancia desconhecida" -- e, com o filtro, ficaria de fora
# da propria regiao em que esta.
