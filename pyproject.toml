[project]
name = "crivo"
version = "0.1.0"
description = "Triagem automatizada de vagas do LinkedIn"
# Expressao SPDX, e nao a tabela `{text = ...}`: esta e a forma que o
# empacotamento adotou (PEP 639) e a antiga esta a caminho da remocao. Ela exige
# setuptools 77, e por isso o piso do build subiu junto -- declarar a licenca na
# forma nova com um piso que nao a entende faria o build falhar em quem tem
# setuptools antigo, que e exatamente quem o piso existe para proteger.
license = "MIT"
license-files = ["LICENSE"]
# Sem teto desde a python-jobspy 1.2.0, que tirou a fixacao NUMPY==1.26.3 --
# a fixacao cujo ultimo wheel era cp312 e que prendia o projeto no 3.12. O piso
# fica no 3.12 porque e o que esta verificado: a suite roda no 3.12 e no 3.14.
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "python-multipart",
  "uvicorn",
  "jinja2",
  "httpx",
  "cryptography",
  # Fixada exata, e nao com faixa: o crivo le o LOG desta biblioteca para saber
  # que foi barrado, e mensagem de log nao e contrato -- muda entre versoes sem
  # aviso. Toda atualizacao precisa conferir `_MARCAS_DE_RECUSA` contra o codigo
  # novo, como foi feito na 1.3.0.
  "python-jobspy==1.3.0",
  "litellm",
  "python-docx",
  "pypdf",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
